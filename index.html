<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mis aplicaciones y juegos</title>
  <meta name="description" content="Menú para abrir mis aplicaciones y juegos publicados en GitHub Pages.">
  <meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/tema.js"></script>
  <script src="js/apps.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div class="barra">
        <span class="autor" id="autor"></span>
        <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar a tema oscuro">
          <svg class="icono-luna" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h1 class="titulo" id="titulo">Mis aplicaciones y juegos</h1>
      <p class="subtitulo" id="subtitulo">Elige uno para abrirlo.</p>
    </header>

    <div class="destacado" id="destacado" hidden></div>

    <div class="controles" id="controles">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por tipo"></div>
      <div class="buscador">
        <label class="sr" for="buscar">Buscar por nombre o descripción</label>
        <svg class="buscador__lupa" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="buscar" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
        <kbd class="buscador__atajo" aria-hidden="true">/</kbd>
      </div>
    </div>

    <p class="sr" id="estado" aria-live="polite"></p>

    <main>
      <ul class="lista" id="lista"></ul>
      <div class="vacio" id="vacio" hidden></div>
      <noscript><p class="vacio">Activa JavaScript para ver el menú.</p></noscript>
    </main>

    <footer class="pie" id="pie" hidden></footer>
  </div>
</body>
</html>
